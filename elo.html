<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TierLab — Elo Voting</title>
<meta name="description" content="Rank anything with Elo: vote on smart duels, watch the ranking settle, get an automatic tier list.">
<meta name="theme-color" content="#14161f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<style>
  :root { --bg:#14161f; --card:#1c1f2b; --b:#2a2e3d; --t:#ecedf2; --m:#8d92a6; --acc:#ffbf7f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--t); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; padding:20px 16px 48px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  a { color:var(--acc); text-decoration:none; }
  h1 { margin:18px 0 4px; font-size:28px; }
  .muted, #sub, #keys { color:var(--m); font-size:14px; }
  .btn, select { background:var(--card); color:var(--t); border:1px solid var(--b); border-radius:10px; padding:8px 14px; font:inherit; cursor:pointer; }
  .btn:hover, select:hover { border-color:var(--acc); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:16px 0; }
  #stats { margin-left:auto; color:var(--m); font-size:14px; display:flex; align-items:center; gap:6px; }
  .bar { display:inline-block; width:90px; height:6px; background:var(--b); border-radius:4px; overflow:hidden; margin-left:6px; }
  .bar i { display:block; height:100%; background:var(--acc); transition:width .3s; }
  #duel { display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:stretch; margin:10px 0 8px; }
  .card { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; min-height:220px;
          padding:22px 16px; border-radius:18px; border:2px solid var(--b); color:var(--t); font:inherit; cursor:pointer;
          background:linear-gradient(160deg, hsl(var(--h) 55% 26%), var(--card) 70%); transition:transform .12s, border-color .12s; }
  .card:hover { transform:translateY(-3px); border-color:hsl(var(--h) 80% 65%); }
  .card:active { transform:scale(.98); }
  .ini { width:64px; height:64px; border-radius:50%; display:grid; place-items:center; font-size:24px; font-weight:800;
         background:hsl(var(--h) 70% 60%); color:#14161f; }
  .nm { font-size:21px; font-weight:700; text-align:center; }
  .note { font-size:13px; color:var(--m); text-align:center; max-width:280px; }
  .rt { position:absolute; top:10px; right:12px; font-size:12px; color:var(--m); }
  .vs { align-self:center; font-weight:900; color:var(--m); }
  .actions { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:26px; }
  .panel { background:var(--card); border:1px solid var(--b); border-radius:16px; padding:16px; }
  .panel h2 { margin:0 0 12px; font-size:16px; }
  ol { list-style:none; margin:0; padding:0; max-height:520px; overflow:auto; }
  li { display:grid; grid-template-columns:28px 1fr auto; gap:2px 8px; padding:7px 4px; border-bottom:1px solid var(--b); }
  .pos { color:var(--m); grid-row:span 2; align-self:center; }
  .r { font-weight:700; color:var(--acc); }
  .m { grid-column:2 / 4; font-size:12px; color:var(--m); }
  .tier { display:flex; min-height:46px; margin-bottom:4px; border-radius:8px; overflow:hidden; background:#10121a; }
  .tl { width:46px; display:grid; place-items:center; font-weight:800; color:#14161f; flex:none; }
  .ti { display:flex; flex-wrap:wrap; gap:5px; padding:6px; align-items:center; }
  .ti em { font-style:normal; font-size:13px; padding:4px 8px; border-radius:6px; background:hsl(var(--h) 45% 30%); }
  @media (max-width:720px) { #duel { grid-template-columns:1fr; } .vs { justify-self:center; } .grid { grid-template-columns:1fr; } .card { min-height:150px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="./" id="back">← TierLab</a>
    <nav><a href="https://github.com/umutseve4/tierlab" target="_blank" rel="noopener">GitHub</a>
      <button id="lang" class="btn" aria-label="Language">EN</button></nav>
  </header>
  <h1 id="h1">⚔️ Elo</h1>
  <div id="sub"></div>
  <div class="row">
    <label id="topicLbl" for="topic">Topic</label>
    <select id="topic"></select>
    <span id="stats"></span>
  </div>
  <div id="duel" aria-live="polite"></div>
  <div class="actions">
    <button id="tie" class="btn">Tie</button>
    <button id="skip" class="btn">Skip</button>
    <button id="undo" class="btn">Undo</button>
    <button id="reset" class="btn">Reset</button>
  </div>
  <p id="keys" style="text-align:center"></p>
  <div class="grid">
    <section class="panel"><h2 id="boardH"></h2><ol id="board"></ol></section>
    <section class="panel"><h2 id="tiersH"></h2><div id="tiers"></div></section>
  </div>
</div>
<script type="module" src="js/elo-page.js"></script>
</body>
</html>
